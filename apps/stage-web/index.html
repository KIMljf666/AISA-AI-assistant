    <!-- 🆕 Sprint 7 Phase B: OBS 叠加模式 — ?obs=1 启用透明背景 -->
    <script>
      ;(function () {
        const params = new URLSearchParams(window.location.search)
        if (params.get('obs') === '1') {
          document.documentElement.classList.add('obs-mode')
          // OBS 浏览器源需要透明背景
          const style = document.createElement('style')
          style.textContent = `
            .obs-mode, .obs-mode body {
              background: transparent !important;
              background-color: transparent !important;
            }
            .obs-mode .page-header,
            .obs-mode .top-bar,
            .obs-mode nav,
            .obs-mode [class*="navbar"],
            .obs-mode [class*="header-bar"],
            .obs-mode [class*="navigation"] {
              display: none !important;
            }
            .obs-mode .main-content,
            .obs-mode #app {
              background: transparent !important;
            }
          `
          document.head.appendChild(style)
          console.log('🎬 OBS Mode enabled — transparent background for overlay')
        }

        // 🆕 Sprint 7.1 Fix 5: 意识流后端自动跳过 Onboarding
        // 检测意识流后端连接 — 如果后端运行中则自动完成 onboarding
        if (!localStorage.getItem('onboarding/completed') || localStorage.getItem('onboarding/completed') === 'false') {
          fetch('http://localhost:8000/api/consciousness/status', { method: 'GET', signal: AbortSignal.timeout(2000) })
            .then(function(r) { if (r.ok) {
              localStorage.setItem('onboarding/completed', 'true')
              localStorage.setItem('consciousness/connected', 'true')
              console.log('🧠 意识流后端已连接 — 自动跳过 Onboarding')
            }})
            .catch(function() { /* 后端未运行, 保持原有 onboarding 流程 */ })
        }
      })()
    </script>
